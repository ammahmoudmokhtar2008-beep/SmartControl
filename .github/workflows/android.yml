name: Build SmartControl APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        required: false
        default: feature/smartcontrol-v0.3
concurrency:
  group: smart-control-android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download MediaPipe hand model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --output app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          test -s app/src/main/assets/hand_landmarker.task
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartControl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
